name: CI (S10 source and installer)
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ['sixteen', 'port/s10-exynos9820']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax / shellcheck
        shell: bash
        run: |
          set -eo pipefail
          code=0
          while IFS= read -r script; do
            bash -n "$script" || code=1
            shellcheck -e SC1090,SC1091 -s bash "$script" || code=1
          done < <(find platform scripts target unica -name '*.sh' \
                        ! -name '*ssi.sh' ! -name 'config.sh' ! -name 'sff.sh' | sort)
          for script in prepare.sh download.sh build.sh verify.sh; do
            bash -n "$script" || code=1
            shellcheck -e SC1090,SC1091 -s bash "$script" || code=1
          done
          exit "$code"
      - name: Validate Python scripts and offline synthetic tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts/internal scripts/tests
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: No firmware and no flashing in default CI
        run: |
          echo 'This CI is source-only and does not certify bootability.'
          echo 'For explicit experimental firmware builds use s10-build.yml.'
  s10-configuration:
    needs: lint-and-test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [beyond0lte, beyond1lte, beyond2lte, beyondx]
    steps:
      - uses: actions/checkout@v4
      - name: Check target build configuration
        env:
          DEVICE: ${{ matrix.target }}
        shell: bash
        run: |
          set -eo pipefail
          source ./buildenv.sh "$DEVICE"
          test "$TARGET_CODENAME" = "$DEVICE"
          test "$TARGET_PLATFORM" = exynos9820
          test "$TARGET_USE_DYNAMIC_PARTITIONS" = false
          test "$TARGET_OS_FILE_SYSTEM_TYPE" = ext4
          test "$TARGET_OS_SINGLE_SYSTEM_IMAGE" = essi
          python3 scripts/internal/s10_framework_audit.py --device "$DEVICE"
          echo "Source configuration passes for $DEVICE — hardware unverified."
