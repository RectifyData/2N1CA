name: S10 Exynos 9820 integration checks
on:
  push:
    branches: ['port/s10-exynos9820']
  pull_request:
    paths:
      - 'target/beyond*/**'
      - 'platform/exynos9820/**'
      - 'scripts/**'
      - '.github/workflows/s10-port-ci.yml'
  workflow_dispatch:

jobs:
  s10-config:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [beyond0lte, beyond1lte, beyond2lte, beyondx]
    steps:
      - uses: actions/checkout@v4
      - name: Verify target metadata and generate build configuration
        shell: bash
        env:
          DEVICE: ${{ matrix.target }}
        run: |
          set -euo pipefail
          source ./buildenv.sh "$DEVICE"
          test "$TARGET_CODENAME" = "$DEVICE"
          test "$TARGET_PLATFORM" = "exynos9820"
          test "$TARGET_USE_DYNAMIC_PARTITIONS" = "false"
          test "$TARGET_OS_FILE_SYSTEM_TYPE" = "ext4"
          test "$TARGET_OS_SINGLE_SYSTEM_IMAGE" = "essi"
          test "$TARGET_PLATFORM_SDK_VERSION" = "31"
          test "$TARGET_PRODUCT_SHIPPING_API_LEVEL" = "28"
          test "$TARGET_OS_BUILD_SYSTEM_EXT_PARTITION" = "false"
          test -s "out/config.sh"
          grep -q 'TARGET_NAME=' "out/config.sh"
          test -s "platform/exynos9820/installer/recovery.fstab"
          ! grep -q -e '/dev/block/by-name/super' -e ' /super ' "platform/exynos9820/installer/recovery.fstab"
          echo "2N1CA $DEVICE configuration parsed. Runtime hardware validation pending."
      - name: Check Bash and copied XML overlay syntax
        shell: bash
        env:
          DEVICE: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bash -n "target/$DEVICE/config.sh"
          bash -n "target/$DEVICE/sff.sh"
          bash -n "platform/exynos9820/config.sh"
          python3 - "$DEVICE" <<'PY'
          import sys, xml.etree.ElementTree as ET
          from pathlib import Path
          device = sys.argv[1]
          for file in sorted(Path("target", device, "overlay").rglob("*.xml")):
              ET.parse(file)
              print("XML OK:", file)
          PY

  installer-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check scripts
        run: |
          set -euo pipefail
          for f in prepare.sh download.sh build.sh verify.sh scripts/lib/s10_pipeline.sh scripts/make_rom.sh scripts/internal/build_full_ota_zip.sh scripts/internal/create_target_files_zip.sh; do bash -n "$f"; done
          python3 -m compileall -q scripts/internal/validate_flashable_zip.py scripts/tests/test_validate_flashable_zip.py
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Confirm unsupported device is rejected before download
        run: |
          if bash build.sh s21-not-s10; then
            echo 'Unsafe: unsupported device accepted' >&2
            exit 1
          fi
      - name: Explain limitations
        run: echo 'Offline checks pass or fail without flashing a device. Bootability not established.'
